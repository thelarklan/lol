[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "launch-on-local"
version = "0.1.0"
description = "Run a repository's Jenkinsfile reproducibly on a local Linux host"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "The Lark Lan" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.19,<5",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/thelarklan/lol"
Repository = "https://github.com/thelarklan/lol"
Issues = "https://github.com/thelarklan/lol/issues"

[project.scripts]
lol = "lol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lol"]

[tool.hatch.envs.default]
dependencies = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
  "types-PyYAML>=6",
  "types-jsonschema>=4",
  "types-requests>=2",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov=lol --cov-report=term-missing --cov-fail-under=50 {args:tests}"
lint = ["ruff check .", "ruff format --check .", "mypy src tests"]
build = "python -m build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
