version: 1
jenkins:
  version: pinned-lts
  plugins:
    - configuration-as-code
    - credentials-binding
    - git
    - plain-credentials
    - workflow-aggregator
pipeline:
  file: Jenkinsfile
node:
  executors: 1
  labels:
    - lol-local
requirements:
  commands:
    - git
    - podman
  podman: true
environment:
  pass:
    - LOL_TEST_IMAGE
  set: {}
artifacts:
  patterns: []
